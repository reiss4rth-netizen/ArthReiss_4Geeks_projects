<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Instagram Post de Arthur</title>
    <link rel="stylesheet" href="styles.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
</head>
<div id="page">
    <div class="header">
        <h1>Instagram feed</h1>
    </div>
    <div class="post">
        <div class="postHead">
            <div class="user">
                <img src="./Post_img_4.jpg">
                <h4>4rthReiss</h4>
            </div>
            <div class="options">
                <h4 class="Date">2d ago</h4>
                <i class="fa-solid fa-ellipsis-vertical"></i>
            </div>
        </div>
        <div class="postBody">
            <img src="./Post_img_5.jpg" solid>
            <div class="interact">
                <div class="icon">
                    <i class="fa-regular fa-heart"></i>  
                    <i class="fa-regular fa-comment"></i>
                    <i class="fa-solid fa-retweet"></i>
                    <i class="fa-regular fa-paper-plane"></i>
                </div>
                <div>
                    <i class="fa-regular fa-bookmark"></i>
                </div>
            </div>
            <div class="textSquare">
                <p id="textPost">Esta preciosa es la cara de mi primera práctica para crear un post de instagram procramando en HTML5 y CSS3. <strong id="hashtag">#4GeeksAcademy</strong></p>
            </div>
        </div>
    </div>
    <div class="post">

<!doctype html>
<html lang="es">

<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>BlackJack</title>
    <link rel="stylesheet" href="style.css">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Libre+Baskerville:ital,wght@0,400..700;1,400..700&display=swap"
        rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet"
        integrity="sha384-sRIl4kxILFvY47J16cr9ZwB07vP4J8+LH7qKQnuqkuIAvNWLzeN8tE5YBujZqJLB" crossorigin="anonymous">
</head>

<body class="bg-success">


    <div id="body" class="row vh-100 align-items-center flex-column">

        <!-- En intervalos de tiempo  -->
        <div id="pageOneBtns" class="col-auto d-flex m-3">
            <div class="d-grid w-25 mt-5 m-2">
                <button type="button" name="" id="otherCard" class="btn btn-primary">
                    Carta random
                </button>
            </div>
            <div class="d-grid w-25 mt-5 m-2 ">
                <button type="button" name="" id="intervalTime" class="btn btn-primary">
                    En intérvalos
                </button>
            </div>
            <div class="d-grid w-25 mt-5 m-2 ">
                <button type="button" name="" id="ask4Card" class="btn btn-primary">
                    Pedir carta
                </button>
            </div>
            <div class="d-grid w-25 mt-5 m-2 ">
                <button type="button" name="" id="changeSize" class="btn btn-primary">
                    Cambiar Tamaño
                </button>
            </div>
        </div>
        <div id="changeSizePage" class="col-4 d-flex d-none">
            <div>
                <label for="range4" class="form-label bg-body p-2 rounded font-naipe">Tamaño del naipe</label>
                <input type="range" class="form-range" min="0.5" max="2" value="1" step="0.1" id="sizeRange">
            </div>
            <div class="d-grid gap-2 m-4 p-2">
                <button type="button" name="" id="backFromResizer" class="btn btn-primary">
                    Volver
                </button>
            </div>

        </div>
        <div id="intervalsPage" class="mb-3 d-flex justify-content-center d-none">
            <div class="mb-3">
                <label for="" class="form-label"></label>
                <select class="form-select form-select-lg" name="" id="timeSelected">
                    <option selected value="0" class="disabled">Selecciona el tiempo</option>
                    <option value="1000">1 seg</option>
                    <option value="2000">2 seg</option>
                    <option value="5000">5 seg</option>
                    <option value="10000">10 seg</option>
                </select>
            </div>
            <div class="d-grid m-3 p-1 ">
                <button type="button" name="" id="goTime" class="btn btn-primary">
                    GO!
                </button>
            </div>
            <div class="d-grid my-3 p-1">
                <button disabled="disabled" type="button" name="" id="stopTime" class="btn btn-secondary">
                    STOP!
                </button>
            </div>
            <div class="d-grid m-3 p-1 ">
                <button type="button" name="" id="back" class="btn btn-primary">
                    Volver
                </button>
            </div>
        </div>
        <div id="ask4aCardPage" class="col-auto d-flex justify-content-center m-3 d-none">
            <div class="m-1">
                <label for="" class="form-label"></label>
                <select class="form-select form-select-lg m-2" name="" id="valor">
                    <option value="0" selected disabled class="text-secondary">Valor</option>
                    <option value="1">A</option>
                    <option value="2">2</option>
                    <option value="3">3</option>
                    <option value="4">4</option>
                    <option value="5">5</option>
                    <option value="6">6</option>
                    <option value="7">7</option>
                    <option value="8">8</option>
                    <option value="9">9</option>
                    <option value="10">J</option>
                    <option value="11">Q</option>
                    <option value="12">K</option>
                </select>
            </div>
            <div class="m-1">
                <label for="" class="form-label"></label>
                <select class="form-select form-select-lg m-2" name="" id="familia">
                    <option value="0" selected disabled class="text-secondary">Familia</option>
                    <option value="1" class="text-danger">Corazones ♥</option>
                    <option value="2" class="text-danger">Diamantes ♦</option>
                    <option value="3">Picas ♠</option>
                    <option value="4">Trévoles ♣</option>
                </select>
            </div>
            <div class="d-grid m-2 p-1">
                <button type="button" id="btnDropCard" class="btn btn-primary">
                    Soltar
                </button>
            </div>
            <div class="d-grid my-2 p-1">
                <button type="button" id="backFromAsk4Card" class="btn btn-warning">
                    Volver
                </button>
            </div>
        </div>
        <div class="col-auto bg-danger rounded-3 text-white fs-3 mb-3 font-naipe d-none" id="alert">
            ¡Hay un dato mal colocado!
        </div>

        <!-- Pedir carta  -->

        <!-- para cambiar el tamaño  -->

        <!-- Estructura carta -->
        <div class="card col-6" id="naipe">
            <div id="cardHeader">
                <div class="row justify-content-start pt-2 px-2 symbol font-naipe"></div>
            </div>
            <div class="card-body vh-100 d-flex flex-column justify-content-center text-center">
                <h4 id="number" class="font-naipe" style="font-size: 80px;">N</h4>
            </div>
            <div id="cardFooter" style="display: inline-block; transform: rotate(180deg);"
                class="row justify-content-end pb-2 px-2 symbol font-naipe">
            </div>
        </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js"
        integrity="sha384-FKyoEForCGlyvwx9Hj09JcYn3nv7wiPVlz7YYwJrWVcXK/BmnVDxM+D2scQbITxI"
        crossorigin="anonymous"></script>
    <script src="/09_BlackJack/app.js"></script>
</body>

</html>

<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">

    <title>Post-card-ArthReiss</title>
    <link rel="stylesheet" href="Pst-Card.css">
</head>
<body>
    <div class="Tarjeta">
        <div class="título">

        </div>
        <div class="Contenido">
            <div class="Info">
                <p>¡Mira esto! Una tarjeta postal creada solamente con HTML5 y CSS3, que aprendí a usar en mi curso en 4Geeks Academy.</p>
                <p>Me gusta mucho aprender de este mundo y no puedo esperar a aprender más.</p>
            </div>
            <div class="Datos">
                <input type="text" placeholder="Tu nombre"></input>
                <input type="text" placeholder="Tu E-mail"></input>
                <input type="text" placeholder="Comentario"></input>
            </div>
        </div>
        <div class="Enviar">
            <button>Enviar tarjeta</button>
        </div>
    </div>
